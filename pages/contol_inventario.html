<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mantenimiento Metalúrgica Vera S.A.E.</title>
        <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/inventario.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../js/api-config.js"></script>
</head>
    <body>
        <h2 id="inventario-title">Control de Inventario</h2>
        <div class="inventario-reportes-actions">
          <a class="inventario-reportes-button" href="reporte_inventario.html">Imprimir reporte</a>
        </div>
        <input type="text" id="inventario-search" placeholder="Buscar por código o producto...">

        <div id="inventario-table-wrap">
          <table id="inventario-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>UM</th>
                <th>Stock F9</th>
                <th>Diferencia</th>
                <th>Cantidad Física</th>
                <th>Ubicación</th>
                <th>Observación</th>
              </tr>
            </thead>
            <tbody id="inventario-body">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>

        <div id="inventario-modal">
          <div id="inventario-modal-content">
            <span id="inventario-modal-close">&times;</span>
            <h3 id="inventario-modal-title">Actualizar dato</h3>
            <p id="inventario-modal-info"></p>
            <form id="inventario-modal-form">
              <label for="inventario-modal-input">Nuevo valor</label>
              <input type="text" id="inventario-modal-input" required>
              <div class="inventario-modal-actions">
                <button type="button" id="inventario-modal-cancel">Cancelar</button>
                <button type="submit" id="inventario-modal-save">Guardar</button>
              </div>
            </form>
          </div>
        </div>
<script src="../js/inventario.js"></script>




<script src="../js/site-layout.js"></script>
<script src="../js/login-modal.js"></script>
<script src="../js/nav-responsive.js"></script>
</body>
</html>
