<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento Metalúrgica Vera S.A.E.</title>
  <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../js/api-config.js"></script>
  <link rel="stylesheet" href="../css/site-dialogs.css">
  <script src="../js/site-dialogs.js"></script>
</head>
<body>
  <main id="mpp-app"></main>

  <template id="mpp-asignar">
    <div class="solicitud">
      <div class="titulo"><h2>Asignación de Mantenimiento Preventivo</h2></div>
      <form id="formAsignarMPP" action="/api/mantenimientos-preventivos/asignacion" method="post">
        <div><label for="maquina">Mantenimiento</label><select id="maquina" name="id" required></select></div>
        <p id="info-averia" class="info-averia"></p>
        <div><label for="responsable">Responsable</label><select id="responsable" name="responsable" required><option value="">Asignar técnico</option></select></div>
        <div><label for="apoyo">Apoyo</label><select id="apoyo" name="apoyos"><option value="">Sin apoyo</option></select></div>
        <button type="submit">Asignar Técnico</button>
      </form>
    </div>
  </template>

  <template id="mpp-cierre">
    <div class="solicitud">
      <div class="titulo"><h2>Cierre de Solicitud de Mantenimiento</h2></div>
      <form id="formCierreMPP" action="/api/mantenimientos-preventivos/cierre" method="post">
        <div><label for="maquina">Mantenimiento</label><select id="maquina" name="id" required></select></div>
        <div><label for="fecha_inicio">Seleccione la fecha de inicio de trabajos:</label><input class="fecha-reprogramacion" type="date" id="fecha_inicio" name="ejecucion_inicio" required></div>
        <div class="campo-ancho">
          <label for="tablaCostos">Costeo de Repuestos</label>
          <table class="tabla-costos"><thead><tr><th>Producto</th><th>Cantidad</th><th>Costo Unitario</th><th>Total</th><th>Acción</th></tr></thead><tbody id="tablaBody"></tbody></table>
          <div id="resultado"><span id="costoTotal">0</span></div>
          <input type="hidden" id="unidad_mo" name="unidad_mo" value="0"><input type="hidden" id="costo_repuestos" name="costo_repuestos" value="0"><input type="hidden" id="costo_mano_obra" name="costo_mano_obra" value="0">
        </div>
        <datalist id="listaProductos"></datalist>
        <div><label for="horas">Horas empleadas en la reparación</label><input type="number" name="horas" id="horas" max="300" min="1" step="1" inputmode="numeric" placeholder="Ej: 8" required></div>
        <div><label for="apoyo">Apoyo</label><select id="apoyo" name="apoyos"><option value="">Sin apoyo</option></select></div>
        <div class="campo-ancho"><label for="observavcion">Observaciones</label><textarea id="observacion" name="notas" rows="5" placeholder="Deje aca las observacions que desee acotar"></textarea></div>
        <button type="submit">Cerrar Mantenimiento Preventivo</button>
      </form>
    </div>
  </template>

  <template id="mpp-reprogramar">
    <div class="solicitud">
      <div class="titulo"><h2>Reprogramación de Mantenimiento Preventivo</h2></div>
      <form id="formReprogramarMPP" action="/api/mantenimientos-preventivos/reprogramacion" method="post">
        <div><label for="maquina">Mantenimiento</label><select id="maquina" name="id" required></select></div>
        <div><label for="fecha_rep">Seleccione la fecha de reprogramación:</label><input class="fecha-reprogramacion" type="date" id="fecha_rep" name="reprogramacion_inicio" required></div>
        <div><label for="motivo_reprogramacion">Motivo de reprogramación</label><textarea id="motivo_reprogramacion" name="motivo_reprogramacion" rows="4" required></textarea></div>
        <div><label for="solicitante_reprogramacion">Solicitante de la reprogramación</label><input type="text" id="solicitante_reprogramacion" name="solicitante_reprogramacion" required></div>
        <div><label for="comunicado_reprogramacion">Como fue comunicada la reprogramación</label><input type="text" id="comunicado_reprogramacion" name="comunicado_reprogramacion" placeholder="Ejemplo: Por correo/Por mensaje de Whatsapp" required></div>
        <button type="submit">Reprogramar Mantenimiento</button>
      </form>
    </div>
  </template>

  <script src="../js/empleados-options.js"></script>
  <script src="../js/mpp-selector.js"></script>
  <script src="../js/site-layout.js"></script>
  <script src="../js/login-modal.js"></script>
  <script src="../js/nav-responsive.js"></script>
</body>
</html>
