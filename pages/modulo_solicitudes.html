<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes de Mantenimiento</title>
  <link rel="stylesheet" href="../css/modulo_solicitudes.css">
  <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="../js/api-config.js"></script>
</head>
<body>
  <div class="container">
    <h2>Informe de Órdenes de Mantenimiento por Maquina</h2>

    <!-- Buscador -->
    <input type="text" id="buscador" placeholder="Buscar por código, nombre o máquina/equipo...">

    <div id="listaEquipos" class="lista-equipos" aria-live="polite"></div>
    <div class="leyenda-estados" aria-label="Estados de las solicitudes">
      <span><i class="indicador-estado indicador-pendiente"></i>Pendiente</span>
      <span><i class="indicador-estado indicador-asignado"></i>Asignada</span>
      <span><i class="indicador-estado indicador-vencido"></i>Vencida</span>
      <span><i class="indicador-estado indicador-completado"></i>Completada</span>
      <span><i class="indicador-estado indicador-retraso"></i>Con retraso</span>
      <span><i class="indicador-estado indicador-reprogramado"></i>Reprogramada</span>
      <span><i class="indicador-estado indicador-baja"></i>De baja</span>
    </div>
  </div>
  <div id="modalEntrega" class="modal-entrega" role="dialog" aria-modal="true" aria-labelledby="tituloModalEntrega" hidden>
    <div class="modal-entrega__contenido">
      <h3 id="tituloModalEntrega">Imprimir entrega</h3>
      <p id="detalleEntrega">Orden seleccionada.</p>
      <div class="modal-entrega__acciones">
        <button id="asignarSolicitud" type="button" hidden>Asignar personal</button>
        <button id="cerrarSolicitud" type="button" hidden>Cerrar solicitud</button>
        <button id="reprogramarSolicitud" type="button" hidden>Reprogramar</button>
        <button id="cancelarEntrega" type="button">Cancelar</button>
        <button id="imprimirEntrega" type="button">Imprimir entrega</button>
      </div>
    </div>
  </div>
  <script src="../js/modulo_solicitudes.js?v=7"></script>




<script src="../js/site-layout.js"></script>
<script src="../js/login-modal.js"></script>
<script src="../js/nav-responsive.js"></script>
</body>
</html>
