<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mantenimiento Metalúrgica Vera S.A.E.</title>
        <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../js/api-config.js"></script>
</head>
    <body>
        <!--<hr>-->

            <main class="solicitud">
                <div class="titulo"><h2>Asignación de Solicitud de Mantenimiento</h2></div>
                <form action="/api/ordenes/asignacion" method="post">
                    <!-- Select con buscador (mÃ¡quina/equipo) -->
                    <div>
                        <label for="maquina">Solicitud/Maquina</label>
                        <select id="maquina" name="componente"></select>
                    </div>
                    <!-- Párrafo dinámico para mostrar la avería -->
                    <p id="info-averia" class="info-averia"></p>

                    <div>
                        <label for="responsable">Responsable</label>
                        <select id="responsable" name="responsable">
                        <option value="">Asignar técnico</option>
                        <option value="5">Santiago Rodríguez</option>
                        <option value="6">Mauricio Patiño</option>
                        <option value="8">Ángel Lezcano</option>
                        <option value="9">Adriano Verón</option>
                        <option value="10">Aldo Ibarrola</option>
                        <option value="3">Blas Giménez</option>
                        <option value="2">Cristhian Redes</option>
                        <option value="1">Gustavo González</option>
                        <option value="4">Edgar Ledezma</option>
                        <option value="11">Cristino Mora</option>
                        <option value="12">Ronaldo Cáceres</option>
                        <option value="13">Alvaro Lovera</option>
                        </select>
                    </div>
                    <!-- Campo de texto (Apoyo) -->
                    <div>
                        <label for="apoyo">Apoyo</label>
                        <select id="apoyo" name="apoyo">
                        <option value="">Sin apoyo</option>
                        <option value="5">Santiago Rodríguez</option>
                        <option value="6">Mauricio Patiño</option>
                        <option value="8">Ángel Lezcano</option>
                        <option value="9">Adriano Verón</option>
                        <option value="10">Aldo Ibarrola</option>
                        <option value="3">Blas Giménez</option>
                        <option value="2">Cristhian Redes</option>
                        <option value="1">Gustavo González</option>
                        <option value="4">Edgar Ledezma</option>
                        <option value="11">Cristino Mora</option>
                        <option value="12">Ronaldo Cáceres</option>
                        <option value="13">Alvaro Lovera</option>
                        </select>
                    </div>

                    <button type="submit">Asignar Técnico</button>
                </form>

                <!-- Buscador propio para el select de máquina -->
                <script src="../js/cierre_ordenes.js"></script><script src="../js/formularios.js"></script>

            </main>




<script src="../js/site-layout.js"></script>
<script src="../js/login-modal.js"></script>
<script src="../js/nav-responsive.js"></script>
</body>
</html>
