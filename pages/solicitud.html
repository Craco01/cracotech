<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mantenimiento Metalúrgica Vera S.A.E.</title>
        <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../js/api-config.js"></script>
</head>
    <body>
        <!--<hr>-->

            <main class="solicitud">
                <div class="titulo"><h2>Registro de Solicitud de Mantenimiento</h2></div>
                <form action="/api/ordenes" method="post">
                    <!-- Select con buscador (mÃ¡quina/equipo) -->
                    <div>
                        <label for="maquina">Máquina/Equipo</label>
                        <select id="maquina" name="componente" required></select>
                    </div>
                    <label for="declarado-radio">¿Necesita agregar una descripción al nombre?  </label><input type="checkbox" id="declarado-radio" name="declarado-radio">

                    <div class="declarado">
                    <label for="declarado">Nombre Declarado *</label>
                    <input type="text" id="declarado" name="declarado" placeholder="*Solo completar si se selecciona servicio">
                    </div>

                    <!-- Area de texto (descripcion de la averia) -->
                    <div class="campo-ancho">
                        <label for="averia">Descripcion de la averia</label>
                        <textarea id="averia" name="averia" rows="5" placeholder="Describa la averia o el problema detectado" required></textarea>
                    </div>
                    <!-- Campo de texto (solicitante) -->
                    <div>
                        <label for="solicitante">Solicitante</label>
                        <input type="text" id="solicitante" name="solicitante" placeholder="Nombre del solicitante" required>
                    </div>
                    <div>
                        <label for="contacto">Contacto de operador</label>
                        <small id="contacto-ayuda" class="field-description">Número de teléfono para reporte de reparación, no obligatorio.</small>
                        <input type="tel" id="contacto" name="contacto" inputmode="numeric" maxlength="10" pattern="09[6789][0-9]{7}" placeholder="Ejemplo: 0981456789" aria-describedby="contacto-ayuda">
                    </div>
                      <!-- Select normal (Sector) -->
                    <div>
                        <label for="sector">Sector</label>
                        <select id="sector" name="sector" required>
                        <option value="" disabled selected>--Asignar Sector--</option>   
                        <option value="1">Mantenimiento</option>
                        <option value="2">Maquinado</option>
                        <option value="3">Armado</option>
                        <option value="4">Accesorios</option>
                        <option value="5">Herrería</option>
                        <option value="6">Pintura</option>
                        <option value="7">Logística</option>
                        <option value="8">Galvamax</option>
                        <option value="9">Administración</option>
                        <option value="10">Obras</option>
                        </select>
                    </div>
                     <!-- Select normal (clasificación) -->
                    <div>
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria" required>
                        <option value="1">Correctivo</option>
                        <option value="2">Preventivo</option>
                        <option value="3">Predictivo</option>
                        </select>
                    </div>
                    <!-- Select normal (Prioridad) - se carga desde la tabla productos -->
                    <div>
                        <label for="prioridad">Prioridad</label>
                        <select id="prioridad" name="prioridad">
                        <option value="">Automática</option>
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                        </select>
                    </div>
                    <button type="submit">Enviar solicitud</button>
                </form>

                <!-- Buscador propio para el select de máquina -->
                <script src="../js/codigo_maquina.js"></script><script src="../js/formularios.js"></script>

            </main>




<script src="../js/site-layout.js"></script>
<script src="../js/login-modal.js"></script>
<script src="../js/nav-responsive.js"></script>
</body>
</html>
