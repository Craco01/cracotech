<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mantenimiento Metalúrgica Vera S.A.E.</title>
        <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../js/api-config.js"></script>
</head>
    <body>
        <!--<hr>-->

            <main class="solicitud">
                <div class="titulo"><h2>Cierre de Solicitud de Mantenimiento</h2></div>
                <form action="/api/ordenes/cierre" method="post">
                    <!-- Select con buscador (mÃ¡quina/equipo) -->
                    <div>
                        <label for="maquina">Solicitud/Maquina</label>
                        <select id="maquina" name="id" required></select>
                    </div>
                    <!-- Párrafo dinámico para mostrar la avería -->
                    <p id="info-averia" class="info-averia"></p>
                    <!-- Campo de texto (Apoyo) -->
                    <div>
                        <label for="apoyo">Apoyo</label>
                        <select id="apoyo" name="apoyo">
                        <option value="">Sin apoyo</option>   
                        <option value="5">Santiago Rodríguez</option>
                        <option value="6">Mauricio Patiño</option>
                        <option value="8">Ángel Lezcano</option>
                        <option value="9">Adriano Verón</option>
                        <option value="10">Aldo Ibarrola</option>
                        <option value="3">Blas Giménez</option>
                        <option value="2">Cristhian Redes</option>
                        <option value="1">Gustavo González</option>
                        <option value="4">Edgar Ledezma</option>
                        <option value="11">Cristino Mora</option>
                        <option value="12">Ronaldo Cáceres</option>
                        <option value="13">Alvaro Lovera</option>
                        </select>
                    </div>
                    <!-- Area de texto (descripcion de la reparación) -->
                    <div class="campo-ancho">
                        <label for="reparación">Reparación Realizada</label>
                        <textarea id="reparación" name="reparacion" rows="5" placeholder="Describa la intervencion realizada o la reparación realizada" required></textarea>
                    </div>

                    <!-- Tabla de Costeo de Repuestos -->
                    <div class="campo-ancho">
                        <label for="tablaCostos">Costeo de Repuestos</label>
                        <table class="tabla-costos">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Costo Unitario</th>
                                    <th>Total</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaBody">
                                <!-- Primera fila vacía se genera desde JS -->
                            </tbody>
                        </table>
                        <div id="resultado">
                            <span id="costoTotal">0</span>
                        </div>
                        <input type="hidden" id="unidad_mo" name="unidad_mo" value="0">
                        <input type="hidden" id="costo_repuestos" name="costo_repuestos" value="0">
                    </div>

                    <!-- datalist global -->
                    <datalist id="listaProductos"></datalist>

                    <!--Entrada de horas empleadas-->
                    <div>
                        <label for="horas">Horas empleadas en la reparación</label>
                        <input type="number" name="horas" id="horas" max="300" min="1" step="1" inputmode="numeric" placeholder="Ej: 8" required>
                    </div>
                     <!-- Select normal (Tipo/Clasificación) -->
                    <div>
                        <label for="tipo">Tipo</label>
                        <select id="tipo" name="clasificacion" required>
                        <option value="Electromecanico">Electromecanico</option>
                        <option value="Electrico">Electrico</option>
                        <option value="Mecanico">Mecanico</option>
                        <option value="Hidraulico/Neumatico">Hidraulico/Neumatico</option>
                        <option value="Eletronico">Eletronico</option>
                        <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="campo-ancho">
                        <label for="observavcion">Observaciones</label>
                        <textarea id="observacion" name="notas" rows="5" placeholder="Deje aca las observacions que desee acotar"></textarea>
                    </div>
                    <button type="submit">Cerrar solicitud</button>
                </form>

                <!-- Buscador propio para el select de máquina -->
                <script src="../js/cierre_ordenes.js"></script>
                <script src="../js/cierre_costos.js"></script>
                <script src="../js/formularios.js"></script>

            </main>




<script src="../js/site-layout.js"></script>
<script src="../js/login-modal.js"></script>
<script src="../js/nav-responsive.js"></script>
</body>
</html>
