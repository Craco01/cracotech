<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de pedidos de herramientas</title>
  <meta name="description" content="Reporte de pedidos de herramientas. Informacion y herramientas de gestion para mantenimiento industrial en Metalurgica Vera.">
<link rel="icon" href="../../img/Logo_MV_obra.png" type="image/png">
<link rel="stylesheet" href="../../css/reporte-herramientas.css?v=20261110-2">
<link rel="stylesheet" href="../../css/herramientas-layout.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Pedidos de herramientas</h1>
    <p id="rango">Reporte por fecha de necesidad</p>
  </header>

  <section class="kpis" id="kpis" aria-label="Resumen de pedidos"></section>

  <section class="barra card" aria-label="Filtros y navegación del reporte">
    <div class="controles">
      <div class="tabs" role="tablist" id="tabs" aria-label="Vista del reporte">
        <button type="button" role="tab" id="tab-tabla" aria-controls="vista" aria-selected="true" tabindex="0" data-vista="tabla" class="on">Tabla</button>
        <button type="button" role="tab" id="tab-mes" aria-controls="vista" aria-selected="false" tabindex="-1" data-vista="mes">Mes</button>
        <button type="button" role="tab" id="tab-semana" aria-controls="vista" aria-selected="false" tabindex="-1" data-vista="semana">Semana</button>
        <button type="button" role="tab" id="tab-dia" aria-controls="vista" aria-selected="false" tabindex="-1" data-vista="dia">Día</button>
      </div>
      <div class="nav" id="nav">
        <button type="button" id="prev" aria-label="Periodo anterior">‹</button>
        <button type="button" id="hoy">Hoy</button>
        <button type="button" id="next" aria-label="Periodo siguiente">›</button>
      </div>
      <button type="button" id="imprimir" class="btn-imprimir" hidden>Imprimir A4</button>
    </div>
    <div class="filtros">
      <input type="search" id="q" placeholder="Buscar OT, puntero o herramienta" aria-label="Buscar pedidos">
      <select id="fEstado" aria-label="Filtrar por estado"><option value="">Todos los estados</option></select>
      <select id="fTipo" aria-label="Filtrar por tipo"><option value="">Todos los tipos</option></select>
      <select id="fHerr" aria-label="Filtrar por estado de herramienta"><option value="">Toda herramienta</option></select>
    </div>
  </section>

  <main id="vista" class="card" role="tabpanel" tabindex="0" aria-labelledby="tab-tabla" aria-live="polite"></main>
  <section id="impresion" aria-label="Reporte imprimible"></section>

<dialog id="modal"><div id="modalBody"></div></dialog>
<dialog id="modalEnvio"><div id="modalEnvioBody"></div></dialog>
</div>

<script src="../../js/herramientas-api-config.js"></script>
<script src="../../js/herramientas-layout.js"></script>
<script src="../../js/login-herramientas.js"></script>
<script src="../../js/reporte-herramientas.js?v=20261110-2"></script>
</body>
</html>
