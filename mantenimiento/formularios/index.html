<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios de Solicitudes</title>
  <link rel="icon" href="../../img/Logo.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../../js/api-config.js"></script>
  <link rel="stylesheet" href="../../css/site-dialogs.css">
  <script src="../../js/site-dialogs.js"></script>
</head>
<body>
  <div id="solicitudes-app" data-seccion="formularios"></div>

  <template id="formularios-solicitud">
    <main class="solicitud">
      <div class="titulo"><h2>Registro de Solicitud de Mantenimiento</h2></div>
      <form action="/api/ordenes" method="post">
        <div>
          <label for="maquina">Máquina/Equipo</label>
          <select id="maquina" name="componente" required></select>
        </div>
        <label for="declarado-radio">¿Desea especificar un nombre para el servicio?</label><input type="checkbox" id="declarado-radio" name="declarado-radio">
        <div class="declarado">
          <label for="declarado">Nombre para el servicio (opcional)</label>
          <input type="text" id="declarado" name="declarado" placeholder="Complete solo si seleccionó servicio">
        </div>
        <div class="campo-ancho">
          <label for="averia">Descripción de la avería</label>
          <textarea id="averia" name="averia" rows="5" placeholder="Describa la avería o el problema detectado" required></textarea>
        </div>
        <div>
          <label for="solicitante">Solicitante</label>
          <input type="text" id="solicitante" name="solicitante" placeholder="Nombre del solicitante" required>
        </div>
        <div>
          <label for="contacto">Teléfono de contacto del operador</label>
          <small id="contacto-ayuda" class="field-description">Opcional. Ingrese un número de teléfono para comunicar el avance de la reparación.</small>
          <input type="tel" id="contacto" name="contacto" inputmode="numeric" maxlength="10" pattern="09[6789][0-9]{7}" placeholder="Ejemplo: 0981456789" aria-describedby="contacto-ayuda">
        </div>
        <div>
          <label for="sector">Sector</label>
          <select id="sector" name="sector" required>
            <option value="" disabled selected>--Asignar Sector--</option>
            <option value="1">Mantenimiento</option>
            <option value="2">Maquinado</option>
            <option value="3">Armado</option>
            <option value="4">Accesorios</option>
            <option value="5">Herrería</option>
            <option value="6">Pintura</option>
            <option value="7">Logística</option>
            <option value="8">Galvamax</option>
            <option value="9">Administración</option>
            <option value="10">Obras</option>
          </select>
        </div>
        <div>
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" required>
            <option value="1">Correctivo</option>
            <option value="2">Preventivo</option>
            <option value="3">Predictivo</option>
          </select>
        </div>
        <div>
          <label for="prioridad">Prioridad</label>
          <select id="prioridad" name="prioridad">
            <option value="">Automática</option>
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
          </select>
        </div>
        <button type="submit">Enviar solicitud</button>
      </form>
    </main>
  </template>

  <template id="formularios-asignar">
    <main class="solicitud">
      <div class="titulo"><h2>Asignación de Solicitud de Mantenimiento</h2></div>
      <form action="/api/ordenes/asignacion" method="post">
        <div>
          <label for="maquina">Solicitud o máquina/equipo</label>
          <select id="maquina" name="componente"></select>
        </div>
        <p id="info-averia" class="info-averia"></p>
        <div>
          <label for="responsable">Responsable</label>
          <select id="responsable" name="responsable">
            <option value="">Asignar técnico</option>
          </select>
        </div>
        <div>
          <label for="apoyo">Apoyo</label>
          <select id="apoyo" name="apoyo">
            <option value="">Sin apoyo</option>
          </select>
        </div>
        <button type="submit">Asignar Técnico</button>
      </form>
    </main>
  </template>

  <template id="formularios-cierre">
    <main class="solicitud">
      <div class="titulo"><h2>Cierre de Solicitud de Mantenimiento</h2></div>
      <form action="/api/ordenes/cierre" method="post">
        <div>
          <label for="maquina">Solicitud o máquina/equipo</label>
          <select id="maquina" name="id" required></select>
        </div>
        <p id="info-averia" class="info-averia"></p>
        <div>
          <label for="apoyo">Apoyo</label>
          <select id="apoyo" name="apoyo">
            <option value="">Sin apoyo</option>
          </select>
        </div>
        <div class="campo-ancho">
          <label for="reparacion">Descripción de la reparación</label>
          <textarea id="reparacion" name="reparacion" rows="5" placeholder="Describa la intervención realizada." required></textarea>
        </div>
        <div>
          <label for="horas">Horas empleadas en la reparación</label>
          <input type="number" name="horas" id="horas" max="300" min="1" step="1" inputmode="numeric" placeholder="Ej: 8" required>
        </div>
        <div>
          <label for="tipo">Tipo</label>
          <select id="tipo" name="clasificacion" required>
            <option value="Electromecanico">Electromecánico</option>
            <option value="Electrico">Eléctrico</option>
            <option value="Mecanico">Mecánico</option>
            <option value="Hidraulico/Neumatico">Hidráulico/neumático</option>
            <option value="Eletronico">Electrónico</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div class="campo-ancho">
          <label for="observacion">Observaciones</label>
          <textarea id="observacion" name="notas" rows="5" placeholder="Escriba aquí cualquier observación relevante."></textarea>
        </div>
        <button type="submit">Cerrar solicitud</button>
      </form>
    </main>
  </template>

  <template id="formularios-habilitacion">
    <main class="solicitud solicitud-habilitacion">
      <div class="titulo"><h2>Solicitar habilitación</h2></div>
      <form action="/api/ordenes/habilitacion" method="post" data-habilitacion="true">
        <div>
          <label for="maquina">Solicitud o máquina/equipo</label>
          <select id="maquina" name="id" required></select>
        </div>
        <p id="info-averia" class="info-averia"></p>
        <div class="campo-ancho">
          <h3 id="costeoTitle">Costeo de repuestos</h3>
          <table id="tablaCostos" class="tabla-costos" aria-labelledby="costeoTitle">
            <colgroup>
              <col class="col-producto">
              <col class="col-cantidad">
              <col class="col-costo">
              <col class="col-total">
              <col class="col-accion">
            </colgroup>
            <thead><tr><th scope="col">Producto</th><th scope="col">Cantidad</th><th scope="col">Costo unitario</th><th scope="col">Total</th><th scope="col">Acción</th></tr></thead>
            <tbody id="tablaBody"></tbody>
          </table>
          <div id="resultado"><span id="costoTotal">0</span></div>
          <input type="hidden" id="costo_repuestos" name="costo_repuestos" value="0">
          <p id="habilitacionCosteoEstado" aria-live="polite">Seleccione una solicitud para comprobar si ya tiene un costeo.</p>
          <div class="habilitacion-comparacion" aria-live="polite">
            <div>
              <span>Producto</span>
              <output id="valorProductoSolicitud">0</output>
            </div>
            <div>
              <span>Repuesto</span>
              <output id="costoRepuestosComparacion">0</output>
            </div>
            <div>
              <span>% costo</span>
              <output id="porcentajeProductoRepuestos">0%</output>
            </div>
          </div>
        </div>
        <button type="submit" disabled>Solicitar habilitación</button>
      </form>
    </main>
  </template>

  <template id="formularios-reprogramar">
    <main class="solicitud">
      <div class="titulo"><h2>Reprogramación de Solicitud de Mantenimiento</h2></div>
      <form action="/api/ordenes/cierre" method="post" data-reprogramar="true">
        <div>
          <label for="maquina">Solicitud o máquina/equipo</label>
          <select id="maquina" name="id" required></select>
        </div>
        <p id="info-averia" class="info-averia"></p>
        <div class="campo-ancho">
          <label for="observacion">Motivo de reprogramación</label>
          <textarea id="observacion" name="notas" rows="5" placeholder="Indique el motivo de la reprogramación"></textarea>
        </div>
        <button type="submit">Reprogramar solicitud</button>
      </form>
    </main>
  </template>

  <template id="formularios-modificar">
    <main class="solicitud">
      <div class="titulo"><h2>Modificar Solicitud de Mantenimiento</h2></div>
      <form action="/api/ordenes/solicitud" method="post" data-modificacion="true">
        <div>
          <label for="ordenSeleccionada">Solicitud a modificar</label>
          <select id="ordenSeleccionada" name="ordenSeleccionada"></select>
        </div>
        <input type="hidden" id="ordenId" name="orden_id" value="">
        <div>
          <label for="maquinaEquipo">Máquina/Equipo</label>
          <select id="maquinaEquipo" name="codigo"></select>
        </div>
        <label for="declarado-radio">¿Desea especificar un nombre para el servicio?</label><input type="checkbox" id="declarado-radio" name="declarado-radio">
        <div class="declarado">
          <label for="declarado">Nombre para el servicio (opcional)</label>
          <input type="text" id="declarado" name="nombre_declarado" placeholder="Complete solo si seleccionó servicio">
        </div>
        <div class="campo-ancho">
          <label for="averia">Descripción de la avería</label>
          <textarea id="averia" name="averia" rows="5" placeholder="Describa la avería o el problema detectado"></textarea>
        </div>
        <div>
          <label for="solicitante">Solicitante</label>
          <input type="text" id="solicitante" name="solicitado" placeholder="Nombre del solicitante">
        </div>
        <div>
          <label for="sector">Sector</label>
          <select id="sector" name="sector">
            <option value="" disabled selected>--Asignar Sector--</option>
            <option value="1">Mantenimiento</option>
            <option value="2">Maquinado</option>
            <option value="3">Armado</option>
            <option value="4">Accesorios</option>
            <option value="5">Herrería</option>
            <option value="6">Pintura</option>
            <option value="7">Logística</option>
            <option value="8">Galvamax</option>
            <option value="9">Administración</option>
            <option value="10">Obras</option>
          </select>
        </div>
        <div>
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="1">Correctivo</option>
            <option value="2">Preventivo</option>
            <option value="3">Predictivo</option>
          </select>
        </div>
        <button type="submit">Modificar solicitud</button>
      </form>
      <div id="confirmacionModificacion" class="login-modal" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmacion" aria-hidden="true" hidden>
        <div class="login-modal-content">
          <h2 id="tituloConfirmacion">¿Quieres registrar la modificación?</h2>
          <p id="contadorConfirmacion">Podrás confirmar en 10 segundos.</p>
          <button type="button" id="confirmarModificacion" disabled>Sí, registrar</button>
          <button type="button" id="cancelarModificacion">Cancelar</button>
        </div>
      </div>
    </main>
  </template>

  <template id="formularios-baja">
    <main class="solicitud">
      <div class="titulo"><h2>Formulario de solicitud de Baja de equipos</h2></div>
      <form action="/api/ordenes/baja" method="post" id="bajaForm">
        <div>
          <label for="maquina">Solicitud o máquina/equipo</label>
          <select id="maquina" name="id" required></select>
        </div>
        <p id="info-averia" class="info-averia"></p>
        <div class="campo-ancho">
          <label for="notas">Motivo de la baja</label>
          <textarea id="notas" name="notas" rows="5" placeholder="Describa la razón para dar de baja el equipo" required></textarea>
        </div>
        <button type="submit">Dar de baja el equipo</button>
      </form>
      <div id="masterKeyModal" class="login-modal" role="dialog" aria-modal="true" aria-labelledby="masterKeyTitulo" aria-hidden="true">
        <div class="login-modal-content">
          <button id="closeMasterKeyModal" class="login-close" type="button" aria-label="Cerrar">&times;</button>
          <h2 id="masterKeyTitulo">Confirmar baja de equipo</h2>
          <form id="masterKeyForm">
            <label for="masterKey">Clave maestra</label>
            <input type="password" id="masterKey" autocomplete="current-password" required>
            <div id="masterKeyMensaje" role="alert" aria-live="polite"></div>
            <button type="submit">Confirmar baja</button>
            <button id="cancelMasterKey" type="button">Cancelar</button>
          </form>
        </div>
      </div>
    </main>
  </template>

  <script src="../../js/site-layout.js"></script>
  <script src="../../js/login-modal.js"></script>
  <script src="../../js/session-guard.js"></script>
  <script src="../../js/nav-responsive.js"></script>
  <script src="../../js/empleados-options.js"></script>
  <script src="../../js/solicitudes.js?v=20261020-2"></script>
</body>
</html>
