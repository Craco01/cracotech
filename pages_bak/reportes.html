<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes de Solicitudes</title>
  <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/site-dialogs.css">
  <link rel="stylesheet" href="../css/report-pagination.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../js/api-config.js"></script>
  <script src="../js/site-dialogs.js"></script>
</head>
<body>
  <div id="solicitudes-app" data-seccion="reportes"></div>

  <template id="reportes-codigos">
    <h2 id="codigos-title">Código de Máquinas</h2>
    <div id="codigos-admin-actions" hidden>
      <a class="codigos-upload-button" href="./carga-xlsx.html?tabla=productos">Cargar Excel de productos</a>
    </div>
    <input type="text" id="codigos-search" placeholder="Buscar términos (espacios o %) por código, descripción o unidad...">
    <div id="codigos-table-wrap">
      <table id="codigos-table">
        <thead><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th>Precio de compra</th></tr></thead>
        <tbody id="codigos-body"></tbody>
      </table>
    </div>
    <nav id="codigos-pagination" class="report-pagination" aria-label="Paginación del catálogo de productos">
      <button id="codigos-prev" type="button" disabled>Anterior</button>
      <span id="codigos-page-status" class="pagination-status" aria-live="polite">0/0</span>
      <button id="codigos-next" type="button" disabled>Siguiente</button>
    </nav>
    <section id="codigos-solicitudes" aria-labelledby="codigos-solicitudes-title">
      <h2 id="codigos-solicitudes-title">Sistema de registro de solicitudes de mantenimiento de respaldo</h2>
      <div class="codigos-form-container">
        <a class="codigos-form-card" href="./formulario-simple.html?src=https://forms.office.com/Pages/ResponsePage.aspx?id=NZva7YvtyUWWTKbrPuRyG1OEneEhG35AiBW0QyXPVf9UNlM3REw3WE5OV1dCWTUyRklCSlJTTEtCTi4u"><span class="codigos-form-icon" aria-hidden="true">📝</span><span>Crear solicitud</span></a>
        <a class="codigos-form-card" href="./formulario-simple.html?src=https://forms.office.com/Pages/ResponsePage.aspx?id=NZva7YvtyUWWTKbrPuRyG1OEneEhG35AiBW0QyXPVf9UNUlWRFpEVExGWkkxWTVPWEhKRU5NWTJGOC4u"><span class="codigos-form-icon" aria-hidden="true">👷‍♂️</span><span>Asignar técnicos</span></a>
        <a class="codigos-form-card" href="./formulario-simple.html?src=https://forms.office.com/Pages/ResponsePage.aspx?id=NZva7YvtyUWWTKbrPuRyG1OEneEhG35AiBW0QyXPVf9UNDBKU1MyTklWR0oyNEtNVzVUVEVaOUVRNC4u"><span class="codigos-form-icon" aria-hidden="true">✅</span><span>Cerrar solicitudes</span></a>
        <a class="codigos-form-card" href="./formulario-simple.html?src=https://forms.office.com/Pages/ResponsePage.aspx?id=NZva7YvtyUWWTKbrPuRyG1OEneEhG35AiBW0QyXPVf9URUZKSDBWUklVTjJaWVo2SUFYVE5PS0M0OC4u"><span class="codigos-form-icon" aria-hidden="true">💻</span><span>Modificar solicitud</span></a>
      </div>
    </section>
  </template>

  <template id="reportes-solicitudes">
    <div class="container">
      <h2>Órdenes de Mantenimiento</h2>
      <div class="buscador-acciones">
        <input type="text" id="buscador" placeholder="Buscar por código, nombre o máquina/equipo...">
        <button type="button" id="buscarRegistros">Buscar en registros</button>
        <button type="button" id="refrescarRegistros" title="Limpiar búsqueda y cargar los registros recientes">Refresh</button>
      </div>
      <div class="table-scroll">
        <table id="tablaOrdenes">
          <thead><tr>
            <th data-col="id">ID</th><th data-col="NE">NE</th><th data-col="codigo">Código</th><th data-col="maquina_equipo">Máquina/Equipo</th><th data-col="nombre_declarado">Nombre Declarado</th><th data-col="averia">Avería</th><th data-col="prioridad">Prioridad</th><th data-col="solicitado">Solicitado</th><th data-col="sector">Sector</th><th data-col="registrado">Registrado</th><th data-col="fecha_inicio">Fecha Inicio</th><th data-col="fecha_vencimiento">Fecha Vencimiento</th><th data-col="fecha_final">Fecha Final</th><th data-col="fecha_entrega">Fecha Entrega</th><th data-col="reparacion">Reparación</th><th data-col="responsable">Responsable</th><th data-col="apoyo">Apoyo</th><th data-col="categoria">Categoría</th><th data-col="clasificacion">Clasificación</th><th data-col="costo_repuestos">Costo Repuestos</th><th data-col="unidad_mo">Unidad MO</th><th data-col="horas">Horas</th><th data-col="total_mo">Total MO</th><th data-col="total_costo">Total Costo</th><th data-col="notas">Notas</th><th data-col="progreso">Progreso</th><th data-col="estado_ejecucion">Estado ejecución</th><th data-col="carga">Carga</th><th data-col="horas_paro">Horas Paro</th><th data-col="horas_mes">Horas Mes</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <nav id="ordenesPagination" class="report-pagination" aria-label="Paginación de órdenes">
        <button id="paginaAnterior" type="button" disabled>Anterior</button>
        <span id="paginaEstado" class="pagination-status" aria-live="polite">0/0</span>
        <button id="paginaSiguiente" type="button" disabled>Siguiente</button>
      </nav>
      <div class="leyenda-estados" aria-label="Estados de las solicitudes">
        <span><i class="indicador-estado indicador-pendiente"></i>Pendiente</span><span><i class="indicador-estado indicador-asignado"></i>Asignada</span><span><i class="indicador-estado indicador-vencido"></i>Vencida</span><span><i class="indicador-estado indicador-completado"></i>Completada</span><span><i class="indicador-estado indicador-retraso"></i>Con retraso</span><span><i class="indicador-estado indicador-reprogramado"></i>Reprogramada</span><span><i class="indicador-estado indicador-baja"></i>De baja</span>
      </div>
    </div>
    <div id="modalEntrega" class="modal-entrega" role="dialog" aria-modal="true" aria-labelledby="tituloModalEntrega" hidden>
      <div class="modal-entrega__contenido">
        <h3 id="tituloModalEntrega">Imprimir entrega</h3><p id="detalleEntrega">Orden seleccionada.</p>
        <div class="modal-entrega__acciones">
          <button id="asignarSolicitud" type="button" hidden>Asignar personal</button><button id="cerrarSolicitud" type="button" hidden>Cerrar solicitud</button><button id="reprogramarSolicitud" type="button" hidden>Reprogramar</button><button id="cancelarEntrega" type="button">Cancelar</button><button id="imprimirEntrega" type="button">Imprimir entrega</button>
        </div>
      </div>
    </div>
  </template>

  <template id="reportes-informes">
    <div class="container">
      <h2>Informe de Órdenes de Mantenimiento por Maquina</h2>
      <input type="text" id="buscador" placeholder="Buscar por código, nombre o máquina/equipo...">
      <div id="listaEquipos" class="lista-equipos" aria-live="polite"></div>
      <nav id="equiposPagination" class="report-pagination" aria-label="Paginación de máquinas y equipos">
        <button id="equiposPaginaAnterior" type="button" disabled>Anterior</button>
        <span id="equiposPaginaEstado" class="pagination-status" aria-live="polite">0/0</span>
        <button id="equiposPaginaSiguiente" type="button" disabled>Siguiente</button>
      </nav>
      <div class="leyenda-estados" aria-label="Estados de las solicitudes">
        <span><i class="indicador-estado indicador-pendiente"></i>Pendiente</span><span><i class="indicador-estado indicador-asignado"></i>Asignada</span><span><i class="indicador-estado indicador-vencido"></i>Vencida</span><span><i class="indicador-estado indicador-completado"></i>Completada</span><span><i class="indicador-estado indicador-retraso"></i>Con retraso</span><span><i class="indicador-estado indicador-reprogramado"></i>Reprogramada</span><span><i class="indicador-estado indicador-baja"></i>De baja</span>
      </div>
    </div>
    <div id="modalEntrega" class="modal-entrega" role="dialog" aria-modal="true" aria-labelledby="tituloModalEntrega" hidden>
      <div class="modal-entrega__contenido">
        <h3 id="tituloModalEntrega">Imprimir entrega</h3><p id="detalleEntrega">Orden seleccionada.</p>
        <div class="modal-entrega__acciones">
          <button id="asignarSolicitud" type="button" hidden>Asignar personal</button><button id="cerrarSolicitud" type="button" hidden>Cerrar solicitud</button><button id="reprogramarSolicitud" type="button" hidden>Reprogramar</button><button id="cancelarEntrega" type="button">Cancelar</button><button id="imprimirEntrega" type="button">Imprimir entrega</button>
        </div>
      </div>
    </div>
  </template>

  <template id="reportes-habilitaciones">
    <div id="habilitacionesReporte" class="container">
      <h2>Seguimiento de solicitudes de habilitación</h2>
      <input type="search" id="habilitacionesBuscador" placeholder="Buscar por código, nombre, máquina/equipo o responsable...">
      <p id="habilitacionesEstado" aria-live="polite">Cargando solicitudes...</p>
      <div id="habilitacionesTablaContenedor" class="table-scroll">
        <table id="tablaHabilitaciones">
          <colgroup>
            <col class="habilitaciones-col-id">
            <col class="habilitaciones-col-maquina">
            <col class="habilitaciones-col-nombre">
            <col class="habilitaciones-col-averia">
            <col class="habilitaciones-col-responsable">
            <col class="habilitaciones-col-costeo">
            <col class="habilitaciones-col-estado">
            <col class="habilitaciones-col-accion">
          </colgroup>
          <thead>
            <tr>
              <th>ID de orden</th>
              <th>Máquina/Equipo</th>
              <th>Nombre declarado</th>
              <th>Avería</th>
              <th>Responsable</th>
              <th>Repuestos y costeo</th>
              <th>Habilitado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="habilitacionesBody"></tbody>
        </table>
      </div>
      <nav id="habilitacionesPagination" class="report-pagination" aria-label="Paginación de solicitudes de habilitación">
        <button id="habilitacionesPaginaAnterior" type="button" disabled>Anterior</button>
        <span id="habilitacionesPaginaEstado" class="pagination-status" aria-live="polite">0/0</span>
        <button id="habilitacionesPaginaSiguiente" type="button" disabled>Siguiente</button>
      </nav>
    </div>
  </template>

  <script src="../js/site-layout.js"></script>
  <script src="../js/login-modal.js"></script>
  <script src="../js/session-guard.js"></script>
  <script src="../js/nav-responsive.js"></script>
  <script src="../js/solicitudes.js"></script>
</body>
</html>
